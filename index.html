<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wolf Cyber Tech</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0d0d0d;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .logo-container {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            overflow: hidden;
            box-shadow: 0 0 25px rgba(0, 210, 255, 0.4);
            border: 2px solid #00d2ff;
            margin-bottom: 25px;
        }
        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        h1 {
            font-size: 2.2rem;
            margin-bottom: 12px;
            letter-spacing: 1px;
            background: linear-gradient(45deg, #00d2ff, #92fe9d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            font-size: 1.1rem;
            color: #a0a0a0;
            max-width: 500px;
            line-height: 1.6;
        }
        .btn {
            margin-top: 30px;
            padding: 12px 30px;
            border: none;
            background: linear-gradient(45deg, #00d2ff, #0072ff);
            color: #fff;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 210, 255, 0.3);
            transition: 0.3s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 210, 255, 0.5);
        }
    </style>
</head>
<body>

    <div class="logo-container">
        <!-- رابط الصورة المصممة للذئب -->
        <img src="https://raw.githubusercontent.com/elazzouz-dotcom/my-site/main/wolf.png" alt="Wolf Logo" id="wolfLogo">
    </div>

    <h1>مرحباً بك في منصة الذئب</h1>
    <p>موقع ضخم، سريع وآمن مصمم بالكامل من التيرمينال عبر تقنيات السحاب والمطوّرين.</p>

    <button class="btn">استكشف الخدمات</button>

</body>
</html>
