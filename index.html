<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XM IA - Cloud AI Platform</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: #050508; color: #f3f4f6; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 20px; }
        header { text-align: center; margin-top: 10px; }
        .logo-box { width: 70px; height: 70px; margin: 0 auto 10px; background: #0b0c10; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 2px solid #00f2fe; box-shadow: 0 0 15px rgba(0, 242, 254, 0.25); }
        .logo-box svg { width: 40px; height: 40px; fill: none; stroke: #00f2fe; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; filter: drop-shadow(0 0 4px #00f2fe); }
        .brand-title { font-size: 2rem; font-weight: 800; background: linear-gradient(45deg, #00f2fe, #4facfe); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .model-badge { display: inline-block; margin-top: 5px; padding: 4px 12px; background: rgba(0, 242, 254, 0.1); border: 1px solid rgba(0, 242, 254, 0.3); color: #00f2fe; border-radius: 12px; font-size: 0.8rem; font-weight: 600; }
        .chat-container { width: 100%; max-width: 700px; flex-grow: 1; margin: 20px 0; display: flex; flex-direction: column; background: #0b0c10; border: 1px solid #1f293d; border-radius: 16px; padding: 20px; overflow-y: auto; max-height: 60vh; }
        .message { margin-bottom: 15px; line-height: 1.6; font-size: 0.95rem; }
        .message.bot { color: #e5e7eb; background: #131722; padding: 12px 16px; border-radius: 12px; border-left: 3px solid #00f2fe; white-space: pre-wrap; }
        .message.user { color: #00f2fe; text-align: right; background: #09131a; padding: 10px 14px; border-radius: 12px; align-self: flex-end; }
        .input-box { width: 100%; max-width: 700px; display: flex; gap: 10px; }
        input[type="text"] { flex-grow: 1; padding: 14px 18px; background: #0b0c10; border: 1px solid #1f293d; border-radius: 12px; color: #fff; font-size: 1rem; outline: none; }
        input[type="text"]:focus { border-color: #00f2fe; }
        button { padding: 14px 24px; background: linear-gradient(45deg, #00f2fe, #0072ff); border: none; border-radius: 12px; color: #fff; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <div class="logo-box">
            <svg viewBox="0 0 100 100">
                <polygon points="50,15 35,35 20,25 30,50 15,65 35,70 50,90 65,70 85,65 70,50 80,25 65,35" />
                <polyline points="35,35 50,45 65,35" />
                <polyline points="30,50 50,60 70,50" />
                <circle cx="40" cy="40" r="2.5" fill="#00f2fe" />
                <circle cx="60" cy="40" r="2.5" fill="#00f2fe" />
            </svg>
        </div>
        <h1 class="brand-title">XM IA</h1>
        <span class="model-badge">Active Model: XM1 Cloud Router</span>
    </header>

    <div class="chat-container" id="chat">
        <div class="message bot">Welcome to <strong>XM IA</strong>. I am <strong>XM1</strong>, your cloud AI assistant. How can I help you today?</div>
    </div>

    <div class="input-box">
        <input type="text" id="userInput" placeholder="Ask XM1 anything...">
        <button onclick="sendMessage()">Send</button>
    </div>

    <script>
        const BACKEND_URL = "https://YOUR_RENDER_URL.onrender.com/api/chat";

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const chat = document.getElementById('chat');
            const prompt = input.value.trim();
            if (!prompt) return;

            const userMsg = document.createElement('div');
            userMsg.className = 'message user';
            userMsg.innerText = prompt;
            chat.appendChild(userMsg);

            input.value = '';
            chat.scrollTop = chat.scrollHeight;

            const botMsg = document.createElement('div');
            botMsg.className = 'message bot';
            botMsg.innerText = 'XM1 is thinking...';
            chat.appendChild(botMsg);

            try {
                const response = await fetch(BACKEND_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ prompt: prompt })
                });

                const data = await response.json();
                botMsg.innerText = data.response || data.error || "Error reading response.";
            } catch (err) {
                botMsg.innerText = "Connection Error: Backend server unreachable.";
            }

            chat.scrollTop = chat.scrollHeight;
        }
    </script>

</body>
</html>
